name: TTS voice samples
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-paj95p]
    paths: [scripts/tts-voice-samples.mjs, .github/workflows/tts-voice-samples.yml]
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - id: gauth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_TTS_SA_KEY }}
          token_format: access_token
      - run: node scripts/tts-voice-samples.mjs
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.gauth.outputs.access_token }}
          GOOGLE_PROJECT_ID: ${{ steps.gauth.outputs.project_id }}
      - name: Encode MP3
        run: |
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -yq ffmpeg)
          for f in samples/voices-gemini/*.wav; do ffmpeg -loglevel error -y -i "$f" -codec:a libmp3lame -b:a 160k "${f%.wav}.mp3" && rm "$f"; done
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add samples/voices-gemini
          git commit -m "Add Chirp 3 HD voice samples [skip ci]" && git push || echo "nothing to commit"
