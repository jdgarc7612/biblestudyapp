name: Deploy AI worker

# Publishes server/ai-worker to Cloudflare Workers. Runs when you press
# "Run workflow" on the Actions tab, and again whenever the worker code changes on main.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# ANTHROPIC_API_KEY. See server/ai-worker/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server/ai-worker/**"
      - ".github/workflows/deploy-ai-worker.yml"

permissions:
  contents: read

concurrency:
  group: ai-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ai-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check the secrets are set
        id: ready
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ANTHROPIC_API_KEY" ] || missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping the AI worker deploy. Missing repository secrets:$missing"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/ai-worker/package-lock.json

      - name: Install
        if: steps.ready.outputs.ok == 'true'
        run: npm ci

      - name: Type check
        if: steps.ready.outputs.ok == 'true'
        run: npx tsc --noEmit

      - name: Deploy
        if: steps.ready.outputs.ok == 'true'
        env:
          # Optional: count signed-in readers' free questions per account (docs/accounts-setup.md).
          SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            npx wrangler deploy --var "SUPABASE_URL:$SUPABASE_URL" --var "SUPABASE_KEY:$SUPABASE_KEY"
          else
            npx wrangler deploy
          fi

      - name: Store the Anthropic API key as a Worker secret
        if: steps.ready.outputs.ok == 'true'
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
