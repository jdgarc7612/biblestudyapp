name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx expo export -p web
        env:
          # The study companion's address (see server/ai-worker/README.md). Left empty,
          # Ask AI uses its built-in preview answers.
          EXPO_PUBLIC_AI_ENDPOINT: ${{ vars.EXPO_PUBLIC_AI_ENDPOINT }}
      # GitHub Pages serves 404.html for any address it has no file for. Using the app's own
      # not-found page lets the app take over instead of showing GitHub's error page.
      - run: cp "dist/+not-found.html" dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
