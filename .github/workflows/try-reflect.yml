name: Try Reflect with AI (temporary)
on:
  push:
    branches: [claude/project-thread-q26iuh]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Try reflections
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node --import ../../tests/register.mjs scripts/try-reflect.ts
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
